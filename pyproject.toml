[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-secure-gateway"
version = "0.2.0"
description = "MCP server with bearer-token auth, deny-by-default policy, rate limiting and a tamper-evident audit log"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastmcp>=2.12,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[project.scripts]
mcp-secure-gateway = "mcp_secure_gateway.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_secure_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::authlib.deprecate.AuthlibDeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
