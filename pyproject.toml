[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-secure-gateway"
version = "0.1.0"
description = "A small, auditable MCP server with deny-by-default authorization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastmcp>=2.12,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[project.scripts]
mcp-secure-gateway = "mcp_secure_gateway.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_secure_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
